services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${CLOUD_BACKEND_URL:?CLOUD_BACKEND_URL is required}
        VITE_CMS_URL: ${CMS_URL:-}
        VITE_PLAUSIBLE_URL: ${PLAUSIBLE_BASE_URL:-}
        VITE_PLAUSIBLE_DOMAIN: ${PLAUSIBLE_TRACKING_DOMAIN:-}
    ports:
      - "3000:80"
    restart: unless-stopped

  database:
    # TODO(deps): Migrate from EOL PostgreSQL 13 and pin PostGIS, Redis, and Directus to tested immutable versions instead of broad or mutable tags.
    image: postgis/postgis:13-master
    volumes:
      - ./data/database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "directus"
      # TODO(security): Load a required database password from a secret and reuse it in the Directus configuration instead of committing a predictable credential.
      POSTGRES_PASSWORD: "directus"
      POSTGRES_DB: "directus"
    healthcheck:
      test: ["CMD", "pg_isready", "--host=localhost", "--username=directus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  cache:
    image: redis:6
    healthcheck:
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  directus:
    image: directus/directus:latest
    ports:
      - 8055:8055
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8055/server/ping || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s
    env_file:
      - .env
    environment:
      # TODO(config): Use required Compose interpolation (${VAR:?message}) for secrets, admin credentials, and public URLs so missing production configuration fails fast.
      SECRET: "${SECRET_KEY}"

      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "directus"
      DB_PASSWORD: "directus"

      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://cache:6379"

      ADMIN_EMAIL: "${CMS_ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${CMS_ADMIN_PASSWORD}"

      PUBLIC_URL: "${CMS_URL}"

# ===== Plausible Analytics (self-hosted) =====
# Временно отключено: не помещается на 2-ГБ сервер (ClickHouse + Postgres + BE).
# Для включения вернуть сервисы plausible_db, plausible_events_db, plausible
# (см. git history) и раскомментировать инициализацию в src/App.vue.
