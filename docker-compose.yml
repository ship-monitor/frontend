services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${CLOUD_BACKEND_URL:?CLOUD_BACKEND_URL is required}
        VITE_CMS_URL: ${CMS_URL:-}
        VITE_PLAUSIBLE_URL: ${PLAUSIBLE_BASE_URL:-}
        VITE_PLAUSIBLE_DOMAIN: ${PLAUSIBLE_TRACKING_DOMAIN:-}
    ports:
      - "3000:80"
    volumes:
      - ./etc/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  database:
    # PostgreSQL 13 EOL: мажорный апгрейд требует dump/restore (см. README).
    image: postgis/postgis:13-3.4
    volumes:
      - ./data/database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "directus"
      # Внимание: пароль применяется только при инициализации кластера.
      # Для существующего ./data/database смените пароль через ALTER USER (см. README).
      POSTGRES_PASSWORD: "${DIRECTUS_DB_PASSWORD:?DIRECTUS_DB_PASSWORD is required}"
      POSTGRES_DB: "directus"
    healthcheck:
      test: ["CMD", "pg_isready", "--host=localhost", "--username=directus"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  cache:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD-SHELL", "[ $$(redis-cli ping) = 'PONG' ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s

  directus:
    # Версия задаётся явно: пинуйте ту, что уже запущена на сервере
    # (docker exec <directus> node -e "console.log(require('./package.json').version)"),
    # затем обновляйте осознанно — миграции Directus необратимы.
    image: directus/directus:${DIRECTUS_VERSION:?DIRECTUS_VERSION is required}
    ports:
      - 8055:8055
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://localhost:8055/server/ping || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_interval: 5s
      start_period: 30s
    env_file:
      - .env
    environment:
      SECRET: "${SECRET_KEY:?SECRET_KEY is required}"

      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "directus"
      DB_PASSWORD: "${DIRECTUS_DB_PASSWORD:?DIRECTUS_DB_PASSWORD is required}"

      CACHE_ENABLED: "true"
      CACHE_AUTO_PURGE: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://cache:6379"

      ADMIN_EMAIL: "${CMS_ADMIN_EMAIL:?CMS_ADMIN_EMAIL is required}"
      ADMIN_PASSWORD: "${CMS_ADMIN_PASSWORD:?CMS_ADMIN_PASSWORD is required}"

      PUBLIC_URL: "${CMS_URL:?CMS_URL is required}"

# ===== Plausible Analytics (self-hosted) =====
# Временно отключено: не помещается на 2-ГБ сервер (ClickHouse + Postgres + BE).
# Для включения вернуть сервисы plausible_db, plausible_events_db, plausible
# (см. git history) и раскомментировать инициализацию в src/App.vue.
